<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" role="img" aria-label="Кафе «Бриз»">

  <defs>
    <clipPath id="bzd-round"><circle cx="200" cy="200" r="168"/></clipPath>
    <linearGradient id="bzd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4f6c"/>
      <stop offset=".62" stop-color="#1b93bf"/>
      <stop offset="1" stop-color="#5cc6e8"/>
    </linearGradient>
    <radialGradient id="bzd-moon-glow">
      <stop offset=".55" stop-color="#bff0ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#bff0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bzd-ring-glow">
      <stop offset=".86" stop-color="#4fd2ff" stop-opacity="0"/>
      <stop offset=".93" stop-color="#4fd2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4fd2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- подсветка вокруг круга, как у кругов на стене зала -->
  <circle cx="200" cy="200" r="196" fill="url(#bzd-ring-glow)"/>

  <g clip-path="url(#bzd-round)">
    <!-- небо -->
    <rect width="400" height="400" fill="url(#bzd-sky)"/>
    <!-- луна: светящийся круг -->
    <circle cx="280" cy="122" r="44" fill="url(#bzd-moon-glow)"/>
    <circle cx="280" cy="122" r="25" fill="#eefbff"/>
    <!-- дальний берег -->
    <path d="M30 222 C70 206 104 212 140 204 C178 196 214 214 252 206 C292 198 330 210 372 202 L372 230 L30 230Z" fill="#0d4a63"/>
    <!-- река: волны, как панели на стене -->
    <rect x="0" y="226" width="400" height="174" fill="#1583ad"/>
    <path d="M0 238 C34 230 66 246 100 238 S166 230 200 238 S266 246 300 238 S366 230 400 238 L400 252 C366 244 334 258 300 250 S234 242 200 250 S134 258 100 250 S34 244 0 252Z" fill="#7fd8f5"/>
    <path d="M0 262 C34 254 66 270 100 262 S166 254 200 262 S266 270 300 262 S366 254 400 262 L400 274 C366 266 334 280 300 272 S234 264 200 272 S134 280 100 272 S34 266 0 274Z" fill="#45b8e0"/>
    <!-- лунная дорожка -->
    <g stroke="#eefbff" stroke-linecap="round" opacity=".85">
      <path d="M262 236 h36" stroke-width="4"/>
      <path d="M268 248 h24" stroke-width="3.5"/>
      <path d="M258 260 h44" stroke-width="3"/>
      <path d="M270 274 h20" stroke-width="3"/>
      <path d="M262 288 h32" stroke-width="2.5"/>
    </g>

    <!-- настил террасы -->
    <rect x="0" y="330" width="400" height="70" fill="#2a1f1a"/>
    <rect x="0" y="330" width="400" height="3" fill="#6b5241"/>

    <!-- круглый столик на одной ножке, на нём свеча -->
    <g fill="#2a1f1a">
      <ellipse cx="284" cy="231" rx="30" ry="4"/>
      <rect x="282" y="233" width="4" height="94"/>
      <ellipse cx="284" cy="329" rx="15" ry="3"/>
    </g>
    <circle cx="298" cy="219" r="9" fill="#ffd27a" opacity=".35"/>
    <rect x="295.5" y="218" width="5" height="10" rx="1" fill="#eefbff"/>
    <path d="M298 211 C300.5 214 300.5 216.5 298 217.5 C295.5 216.5 295.5 214 298 211Z" fill="#ffd27a"/>

    <!-- венский стул -->
    <g fill="none" stroke="#2a1f1a" stroke-width="3" stroke-linecap="round">
      <path d="M151 266 C146 248 144 228 147 211 C149 203 156 200 163 204"/>
      <path d="M144 268 L200 268"/>
      <path d="M150 269 L140 330 M194 269 L204 330"/>
    </g>

    <!-- девушка: сидит вполоборота к реке, нога на ногу -->
    <g fill="#2a1f1a">
      <!-- нижняя нога -->
      <path d="M212 262 L232 266 C232 286 230 304 230 318 C234 322 240 326 245 330 L226 330 C224 324 222 320 222 316 C220 300 216 282 211 270Z"/>
      <!-- верхняя нога, закинутая -->
      <path d="M166 251 C190 249 212 247 233 248 C239 249 241 255 239 261 L252 312 C256 316 263 318 271 322 C266 325 256 325 248 321 L243 318 C238 300 233 283 228 265 C210 267 188 269 166 268Z"/>
      <!-- корпус -->
      <path d="M171 176 L183 176 C186 182 191 184 194 190 C197 198 196 208 192 216 C188 224 186 232 187 242 C188 246 190 249 193 251 L168 251 L168 268 C158 268 152 262 152 254 C152 246 158 238 162 230 C165 220 160 206 162 196 C163 188 167 182 171 176Z"/>
      <!-- шея, голова, высокий пучок -->
      <path d="M171.5 158 L181 158 L183 178 L170 178Z"/>
      <ellipse cx="177" cy="146" rx="12" ry="14.5"/>
      <circle cx="168" cy="129" r="8"/>
      <!-- кисть с бокалом -->
      <ellipse cx="244" cy="202" rx="4.5" ry="5"/>
    </g>
    <!-- шпилька -->
    <path d="M247 321 L245 329" stroke="#2a1f1a" stroke-width="2" stroke-linecap="round"/>
    <!-- рука: плечо — локоть — бокал у лица -->
    <g fill="none" stroke="#2a1f1a" stroke-linecap="round" stroke-linejoin="round">
      <path d="M187 190 C197 200 206 213 213 226" stroke-width="8.5"/>
      <path d="M213 226 C223 219 233 211 242 204" stroke-width="6.5"/>
    </g>

    <!-- шарф на ветру -->
    <path d="M184 172 C182 180 172 182 166 177 C152 180 140 174 128 166 C116 158 104 160 94 168 C100 154 116 148 132 156 C144 162 154 168 166 168 C172 164 180 164 184 172Z" fill="#7fd8f5"/>

    <!-- бокал -->
    <g fill="none" stroke="#eefbff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M235 164 L255 164 C256 178 251 185 245 185 C239 185 234 178 235 164Z"/>
      <path d="M245 185 L245 198"/>
    </g>
    <path d="M236.2 174 L253.8 174 C252.8 180.5 249.5 183 245 183 C240.5 183 237.2 180.5 236.2 174Z" fill="#e8b15a"/>
  </g>

  <!-- рамка круга -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#eefbff" stroke-width="3"/>
