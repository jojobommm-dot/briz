<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Знак: кольцо с волной внутри, тонкой линией в цвет (currentColor) -->
  <symbol id="logo" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="20" cy="20" r="12.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
    <path d="M12.5 21c1.9-1.9 3.8-1.9 5.6 0s3.8 1.9 5.6 0 2.7-1.4 3.8-.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <!-- Прежний знак, круг с двумя волнами: остался для иконок приложения -->
  <symbol id="wave" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="20" fill="currentColor"/>
    <path d="M7 19c3.2-3 6.4-3 9.6 0s6.4 3 9.6 0 4.6-2.2 6.8-1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M7 26c3.2-3 6.4-3 9.6 0s6.4 3 9.6 0 4.6-2.2 6.8-1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
  </symbol>
  <!-- Волнистый разделитель, как в эталоне -->
  <symbol id="squiggle" viewBox="0 0 190 12">
    <path d="M1 7c9-7 18-7 27 0s18 7 27 0 18-7 27 0 18 7 27 0 18-7 27 0 18 7 27 0 18-7 26-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <!-- Клош — значок банкетов -->
  <symbol id="cloche" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 36h36M4 40h40M9 36a15 15 0 0 1 30 0"/>
      <path d="M24 21v-4M21 16h6"/>
      <path d="M14 31a10 10 0 0 1 6-8" opacity=".6"/>
    </g>
  </symbol>
  <!-- Тарелка супа — значок обедов -->
  <symbol id="bowl" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 24h36a18 18 0 0 1-36 0z"/>
      <path d="M16 42h16"/>
      <path d="M18 18c-2-3 2-5 0-8M24 18c-2-3 2-5 0-8M30 18c-2-3 2-5 0-8" opacity=".6"/>
    </g>
  </symbol>
  <symbol id="chat" viewBox="0 0 24 24">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/>
  </symbol>
  <symbol id="check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="arrow" viewBox="0 0 24 24">
    <path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="long-left" viewBox="0 0 32 16">
    <path d="M31 8H3m6-6L2 8l7 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="long-right" viewBox="0 0 32 16">
    <path d="M1 8h28m-6-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="chevron-down" viewBox="0 0 24 24">
    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="phone" viewBox="0 0 24 24">
    <path d="M6.6 3.5h2.6l1.4 4-1.9 1.3a11 11 0 0 0 6.5 6.5l1.3-1.9 4 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="vk" viewBox="0 0 24 24">
    <path d="M12.8 17.5C6.9 17.5 3.5 13.4 3.4 6.5h3c.1 5 2.3 7.2 4 7.6V6.5h2.8v4.3c1.7-.2 3.5-2.1 4.1-4.3H20c-.5 2.6-2.4 4.5-3.8 5.3 1.4.6 3.6 2.3 4.4 5.7h-3.1c-.7-2.2-2.4-3.9-4.7-4.1v4.1z" fill="currentColor"/>
  </symbol>
</svg>
