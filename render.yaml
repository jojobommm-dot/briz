# Выкладка на Render: Dashboard → New → Blueprint → этот репозиторий.
# Каждый push в main выкладывается сам. База — PostgreSQL на Neon (бесплатно и
# без срока, в отличие от бесплатной базы Render, которая живёт 30 дней).
services:
  - type: web
    name: briz
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    # Render стоит перед приложением прокси с HTTPS — доверяем его заголовкам
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      # Строка подключения из Neon (Connection string) как есть, с ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Адрес сайта без слэша: сначала https://briz.onrender.com, потом свой домен
      - key: BASE_URL
        sync: false
      - key: MANAGE_USER
        value: manager
      # Пароль первого менеджера — вводится в Render при создании
      - key: MANAGE_PASSWORD
        sync: false
