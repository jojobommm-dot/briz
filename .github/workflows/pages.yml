# Статичная копия сайта на GitHub Pages (как coffe): собирается tools/freeze.py
# после каждого push в main. Онлайн-заказ, кабинеты и /manage — только на сервере.
# Один раз включить: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # requirements-dev: в нём httpx — им tools/freeze.py рисует страницы
      - run: pip install -r requirements-dev.txt
      - id: pages
        uses: actions/configure-pages@v5
      # base_url — https://jojobommm-dot.github.io/briz или свой домен, если задан в Settings → Pages
      - run: python tools/freeze.py _site --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
